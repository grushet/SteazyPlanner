<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SteazyPlanner — Login</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1a1a1a;
      color: #e8eef2;
    }
    .auth-container {
      background: rgba(0,0,0,0.45);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    h2 { margin: 0 0 10px 0; text-align: center; }
    input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: white;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    #login-btn { background-color: #80deea; color: #1a1a1a; }
    #register-btn { background-color: transparent; border: 1px solid #80deea; color: #80deea; }
    #error-message { color: #ff6b6b; font-size: 0.85rem; text-align: center; min-height: 20px; }
    #forgot-btn {
      background: none;
      border: none;
      color: #80deea;
      font-size: 0.8rem;
      text-align: right;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      font-weight: normal;
      align-self: flex-end;
    }
    #google-btn {
      background: #fff;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    #google-btn:hover { background: #f0f0f0; }
    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <h2>SteazyPlanner</h2>
    <input type="email" id="email" placeholder="Email address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="forgot-btn">Forgot password?</button>
    <div id="error-message"></div>
    <button id="login-btn">Log In</button>
    <button id="register-btn">Create Account</button>
    <div class="divider">or</div>
    <button id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continue with Google
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAuth, browserLocalPersistence, setPersistence, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8wH8WMmXtFSN8yFAVrizTS7IqLQzWKg",
      authDomain: "steazyplanner.firebaseapp.com",
      projectId: "steazyplanner",
      storageBucket: "steazyplanner.firebasestorage.app",
      messagingSenderId: "231639329077",
      appId: "1:231639329077:web:4242cb4d5f9ff81b9fc47c",
      measurementId: "G-7GWFDHKKER"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence);
    const db = getFirestore(app);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const registerBtn = document.getElementById('register-btn');
    const forgotBtn = document.getElementById('forgot-btn');
    const googleBtn = document.getElementById('google-btn');
    const errorMessage = document.getElementById('error-message');

    // Handle Registration
    registerBtn.addEventListener('click', async () => {
      try {
        errorMessage.textContent = "";
        const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        
        // Create initial database document for the new user
        await setDoc(doc(db, "users", userCredential.user.uid), {
          tasks: [],
          satTopics: [] // Will store SAT progress
        });
        
      } catch (error) {
        errorMessage.textContent = error.message.replace("Firebase: ", "");
      }
    });

    // Handle Login
    loginBtn.addEventListener('click', async () => {
      try {
        errorMessage.textContent = "";
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (error) {
        errorMessage.textContent = "Invalid email or password.";
      }
    });

    // Handle Forgot Password
    forgotBtn.addEventListener('click', async () => {
      errorMessage.textContent = "";
      errorMessage.style.color = "#ff6b6b";
      const email = emailInput.value.trim();
      if (!email) {
        errorMessage.textContent = "Enter your email address first.";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        errorMessage.style.color = "#80deea";
        errorMessage.textContent = "Password reset email sent. Check your spam folder if you don't see it.";
      } catch (error) {
        errorMessage.style.color = "#ff6b6b";
        errorMessage.textContent = error.message.replace("Firebase: ", "");
      }
    });

    // Handle Google Sign-In
    googleBtn.addEventListener('click', async () => {
      errorMessage.textContent = "";
      try {
        const provider = new GoogleAuthProvider();
        const userCredential = await signInWithPopup(auth, provider);
        const userRef = doc(db, "users", userCredential.user.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          await setDoc(userRef, { tasks: [], satTopics: [] });
        }
      } catch (error) {
        if (error.code !== 'auth/popup-closed-by-user') {
          errorMessage.textContent = error.message.replace("Firebase: ", "");
        }
      }
    });

    // Monitor Authentication State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const redirect = sessionStorage.getItem('postLoginRedirect');
        sessionStorage.removeItem('postLoginRedirect');
        window.location.replace(redirect || 'taskplanner-cs3/main_page.html');
      }
    });
  </script>

</body>
</html>
